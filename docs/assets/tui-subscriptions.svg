<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">VPNCTL 0.1 订阅管理示意</title>
  <desc id="desc">虚构示例数据。当前激活示例订阅 A，示例订阅 B 和本地示例处于休息状态。支持修改来源和名称。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081923"/><stop offset="1" stop-color="#101d2c"/></linearGradient>
    <style>text{font-family:Consolas,'Noto Sans Mono CJK SC',monospace;font-size:20px;fill:#d5e5ea}.title{font-size:25px;font-weight:700;fill:#6bd6ea}.dim{fill:#869da8;font-size:18px}.selected{fill:#08202b;font-weight:700}.ok{fill:#7dd8b6}.panel{fill:#0d2330;stroke:#426b7a;stroke-width:1.5}</style>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <text x="32" y="42" class="title">VPNCTL  0.1</text><text x="1238" y="42" text-anchor="end" class="dim">界面示意 · 数据均为虚构</text>
  <text x="32" y="74">页面:订阅管理 | 接口:在线 | 进程:示例 | 订阅:示例订阅 A</text>
  <text x="32" y="104">提供方:示例订阅 A | 已连接:示例节点 01</text>
  <text x="32" y="134" class="dim">模式:mix | mixed:7890 | api:9090 | 来源:自动探测</text>
  <text x="32" y="164" class="ok">就绪：仅当前激活订阅参与运行，其余订阅休息。</text>
  <rect x="24" y="188" width="230" height="476" rx="8" class="panel"/>
  <text x="42" y="223" class="title">页面 (10)</text>
  <text x="44" y="267">总览</text><text x="44" y="305">运行状态</text>
  <rect x="36" y="322" width="206" height="34" rx="3" fill="#6bd6ea"/>
  <text x="44" y="347" class="selected">&gt; 订阅管理</text>
  <text x="44" y="385">节点与策略组</text><text x="44" y="423">测速目标</text><text x="44" y="461">端口与环境</text>
  <text x="44" y="499">主题与外观</text><text x="44" y="537">安装与升级</text><text x="44" y="575">Shell 集成</text><text x="44" y="613">日志与诊断</text>
  <rect x="274" y="188" width="982" height="476" rx="8" class="panel"/>
  <text x="296" y="223" class="title">订阅 (3)</text><text x="1228" y="223" text-anchor="end" class="dim">单激活订阅</text>
  <rect x="290" y="250" width="950" height="44" rx="3" fill="#6bd6ea"/>
  <text x="306" y="279" class="selected">&gt; 示例订阅 A</text><text x="832" y="279" class="selected">已激活 · 已同步 · 6 节点</text>
  <text x="306" y="335">示例订阅 B</text><text x="832" y="335" class="dim">休息中 · 已同步 · 4 节点</text>
  <text x="306" y="389">本地示例</text><text x="832" y="389" class="dim">休息中 · 待同步</text>
  <path d="M296 425H1230" stroke="#294b5a"/>
  <text x="306" y="464" class="title">操作说明</text>
  <text x="306" y="506">Enter 激活当前订阅，其他订阅自动休息</text>
  <text x="306" y="546">e 修改名称、URL 或 YAML 文件路径</text>
  <text x="306" y="586">新来源验证成功后才保存；失败保留原订阅与缓存</text>
  <text x="306" y="626" class="dim">x 删除前确认 · y 同步当前激活订阅</text>
  <path d="M24 686H1256" stroke="#426b7a"/>
  <text x="32" y="718" class="dim">Tab 切换区域   Enter 激活订阅   / 搜索   ? 帮助   q 退出</text>
  <text x="32" y="750">a 添加订阅   e 修改订阅   y 同步   x 删除订阅   r 刷新</text>
  <text x="32" y="780" class="dim">示意图非真实运行截图，不包含订阅凭据或个人设备信息。</text>
</svg>
